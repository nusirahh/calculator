<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My calculator</title>
</head>

<body>
    <div class="calculator">
      
      <input type="text" id="display" readonly>
      
      <div class="buttons">
        
        <button onclick="clearDisplay()" class="special">C</button>
        
        <button onclick="deleteLast()" class="special">⌫</button>
        
        <button onclick="percentage()" class="special">%</button>
        
        <button onclick="chooseOperator('/')" class="operator">÷</button>
        
        <button onclick="appendNumber        ('1')">1</button>
        
        <button onclick="appendNumber        ('2')">2</button>
        
      <button onclick="appendNumber        ('3')">3</button>

        <button onclick="appendNumber('4')" >4</button>
        
        <button onclick="appendNumber
        ('5')">5</button>
         
        <button onclick="appendNumber ('6')">6</button>
        
        <button onclick="appendNumber('7')">7</button>
        
        <button onclick="appendNumber('8')">8</button>
        
        <button onclick="appendNumber('9')">9</button>
        
        <button onclick="chooseOperator('*')" class="operator">*</button>
          
        
  
</body>

</html>
